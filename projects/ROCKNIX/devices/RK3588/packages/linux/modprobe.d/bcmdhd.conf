# Rockchip's vendor Broadcom/Synaptics driver claims every Broadcom SDIO chip
# (and every class-0 SDIO function), so never autoload it: it would race
# brcmfmac (e.g. AP6256) and other SDIO Wi-Fi. Boards that need it (Orange Pi
# 5 Max/Ultra with AP6611S/SYN43711) load it from a device quirk.
blacklist bcmdhd
