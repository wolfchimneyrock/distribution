# aic8800_bsp's SDIO ID table matches every SDIO Wi-Fi function (class 07) and
# its placeholder driver accepts non-AIC chips, so it must never autoload on
# boards with other SDIO Wi-Fi (e.g. RTL8821CS handhelds). aic8800_fdrv_sdio only
# matches AIC IDs and pulls aic8800_bsp in as a dependency, so real AIC8800
# SDIO boards still work.
blacklist aic8800_bsp

# Same SDIO settings Armbian uses on the Radxa ZERO 3W / ROCK 3C:
# quiet logging, built-in regulatory table, Wi-Fi power save off.
options aic8800_fdrv_sdio aicwf_dbg_level=0 custregd=0 ps_on=0
